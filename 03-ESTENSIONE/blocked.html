<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accesso bloccato — VEDETTA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#101720; --panel:#1c2636; --line:#2d3a50; --txt:#eef2f6; --dim:#8b96a8; --crit:#e5484d; --acc:#5aba93; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(1200px 600px at 50% -10%, #1c3a30, var(--bg)); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { background:var(--panel); border:1px solid var(--line); border-top:4px solid var(--crit); border-radius:16px; padding:36px 34px; max-width:520px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4); }
    .icon { font-size:56px; line-height:1; }
    h1 { margin:14px 0 6px; font:500 24px/1.2 'Poppins',sans-serif; }
    .badge { display:inline-block; margin-top:2px; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#ff9ea1; background:#3a1519; border:1px solid #5a2026; padding:3px 10px; border-radius:20px; }
    p { color:var(--dim); line-height:1.55; font-size:14px; margin:16px 0; }
    .dom { display:inline-block; font-family:ui-monospace,Menlo,monospace; color:var(--txt); background:#142e28; border:1px solid var(--line); padding:3px 10px; border-radius:8px; word-break:break-all; }
    .actions { margin-top:22px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:14px; cursor:pointer; }
    button.ghost { background:#142e28; border:1px solid var(--line); color:var(--txt); }
    .brand { display:inline-flex; align-items:center; gap:6px; font-weight:400; font-family:'Poppins',sans-serif; letter-spacing:3px; color:var(--txt); vertical-align:middle; }
    .brand img { height:13px; width:auto; display:block; }
    .foot { margin-top:22px; color:var(--dim); font-size:11px; letter-spacing:1px; display:flex; align-items:center; justify-content:center; gap:7px; }
    .foot img { height:12px; width:auto; display:block; opacity:.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <div class="badge">AdBlock Interceptor</div>
    <h1>Accesso bloccato</h1>
    <p>Il sito <span class="dom" id="dom">questo sito</span> è nella lista dei <strong>domini bloccati</strong> dalla policy aziendale.</p>
    <p>La richiesta è stata intercettata e interrotta dall'agente <span class="brand"><img src="icons/tesys-mark.png" alt="">VEDETTA</span>.</p>
    <div class="actions">
      <button class="ghost" onclick="history.length > 1 ? history.back() : window.close()">← Torna indietro</button>
    </div>
    <div class="foot"><img src="icons/tesys-mark.png" alt="">VEDETTA · Vigilanza Endpoint Dati E Traffico AI</div>
  </div>
  <script>
    try { const d = new URLSearchParams(location.search).get("d"); if (d) document.getElementById("dom").textContent = d; } catch (e) {}
  </script>
</body>
</html>
